<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Jul-öl @ GreenLion — 4 december</title>
<meta property="og:title" content="Jul-öl @ GreenLion">
<meta property="og:description" content="Du är inbjuden. Fredag 4 december 2026.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Libre+Caslon+Text:ital@1&family=Libre+Franklin:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f4e7c8; --paper-2: #ecd9ad; --red: #b3131b; --green: #0e4a2a; --ink: #1d1a14; --gold: #d8a928;
    --display: "Anton", Impact, "Arial Narrow Bold", sans-serif;
    --sans: "Libre Franklin", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --serif: "Libre Caslon Text", Georgia, "Times New Roman", serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; background: var(--green); background-image: radial-gradient(circle at 20% 15%, #14633a 0, transparent 45%), radial-gradient(circle at 85% 90%, #0a3a20 0, transparent 50%); background-attachment: fixed; color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }

  /* Utan animation: affischen, sedan bilden under */
  .stage { padding: 1.25rem; display: grid; gap: 2.5rem; justify-items: center; }
  .posterwrap { --tw: clamp(120px, 36vw, 170px); position: relative; width: 100%; max-width: 520px; padding-top: calc(var(--tw) * .99 - 8px); }
  .toucan { position: absolute; z-index: 3; top: 0; left: -6px; width: var(--tw); height: auto; pointer-events: none; }
  .reveal { width: 100%; max-width: 640px; text-align: center; color: var(--paper); }

  /* Affischen */
  .poster { position: relative; width: 100%; background: radial-gradient(ellipse at 50% 35%, var(--paper) 0, var(--paper-2) 100%); border: 10px solid var(--ink); box-shadow: 0 0 0 3px var(--paper), 0 0 0 6px var(--red), 0 18px 40px rgba(0,0,0,.45); padding: clamp(1.8rem, 7vw, 2.8rem) clamp(1.2rem, 6vw, 2.4rem) clamp(1.8rem, 7vw, 2.6rem); text-align: center; overflow: hidden; color: var(--ink); }
  .poster::before, .poster::after { content: "✶"; position: absolute; top: .55rem; color: var(--red); font-size: 1.1rem; }
  .poster::before { left: .7rem; }
  .poster::after { right: .7rem; }

  .lovely { font-family: var(--display); font-size: clamp(1.7rem, 7.5vw, 2.4rem); line-height: 1; color: var(--red); letter-spacing: .01em; transform: rotate(-2deg); transform-origin: left center; text-align: left; }
  .big { font-family: var(--display); font-weight: 400; font-size: clamp(5rem, 26vw, 8.6rem); line-height: .88; color: var(--red); text-transform: uppercase; letter-spacing: .005em; margin: .7rem 0 0; transform: rotate(-2deg); text-shadow: 3px 3px 0 var(--ink); }
  .where { display: inline-block; margin: 1rem 0 0; padding: .35rem 1.1rem .4rem; background: var(--green); color: var(--paper); font-family: var(--display); font-size: clamp(1.6rem, 8vw, 2.4rem); letter-spacing: .06em; text-transform: uppercase; transform: rotate(1.5deg); box-shadow: 4px 4px 0 var(--ink); }
  .where span { color: var(--gold); }
  .note { margin: 1.6rem 0 0; font-family: var(--serif); font-style: italic; font-size: 1.1rem; line-height: 1.5; }
  .sign { margin-top: 1.3rem; font-size: .72rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--red); }

  /* Bilden på puben */
  .photo { margin: 0 auto; border: 10px solid var(--ink); box-shadow: 0 0 0 3px var(--paper), 0 0 0 6px var(--red), 0 18px 40px rgba(0,0,0,.45); background: var(--ink); overflow: hidden; }
  .photo img { display: block; width: 100%; height: auto; }
  .meet { margin-top: 2.2rem; }
  .meet .kicker { font-family: var(--sans); font-size: .74rem; font-weight: 700; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); }
  .meet h2 { font-family: var(--display); font-weight: 400; font-size: clamp(2.8rem, 12vw, 5rem); line-height: 1; letter-spacing: .02em; text-transform: uppercase; margin: .3rem 0 .6rem; color: var(--paper); text-shadow: 3px 3px 0 var(--red); }
  .when { margin: 1.2rem auto 0; max-width: 560px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border-top: 2px solid var(--red); padding-top: .9rem; }
  .when div { padding: 0 .6rem; }
  .when div + div { border-left: 1px solid rgba(244,231,200,.3); }
  .when dt { font-family: var(--sans); font-size: .62rem; font-weight: 700; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); }
  .when dd { margin: .2rem 0 0; font-family: var(--display); font-size: clamp(1.1rem, 4.4vw, 1.4rem); line-height: 1.15; letter-spacing: .03em; text-transform: uppercase; color: var(--paper); }
  @media (max-width: 460px) {
    .when { grid-template-columns: 1fr; }
    .when div { padding: .45rem 0; }
    .when div + div { border-left: 0; border-top: 1px solid rgba(244,231,200,.3); }
  }
  .meet p { margin: 0; font-family: var(--serif); font-style: italic; font-size: 1.1rem; line-height: 1.5; color: var(--paper); opacity: .9; }

  .hint { display: none; }

  /* Med animation: affischen dras uppåt och bilden avslöjas */
  .anim { height: 340vh; position: relative; }
  .anim .stage { position: sticky; top: 0; height: 100vh; padding: 0; display: block; overflow: hidden; }
  .anim .reveal { position: absolute; inset: 0; max-width: none; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.25rem; }
  .anim .photo { width: min(92vw, 640px, calc((100vh - 19rem) * 4 / 3)); clip-path: inset(calc((1 - var(--u, 0)) * 50%)); transform: scale(calc(1.12 - .12 * var(--u, 0))); opacity: var(--u, 0); }
  .anim .meet { margin-top: 1.8rem; opacity: var(--v, 0); transform: translateY(calc((1 - var(--v, 0)) * 28px)); }
  .anim .posterwrap { position: absolute; left: 50%; top: 50%; width: calc(100% - 2.5rem); max-width: 520px; z-index: 2; transform: translate(-50%, -50%) translateY(calc(var(--t, 0) * -125vh)) rotate(calc(var(--t, 0) * -8deg)) scale(var(--fit, 1)); transform-origin: 50% 50%; will-change: transform; }
  .anim .hint { display: block; position: absolute; left: 0; right: 0; bottom: 1.1rem; z-index: 3; text-align: center; font-family: var(--sans); font-size: .7rem; font-weight: 700; letter-spacing: .26em; text-transform: uppercase; color: var(--paper); opacity: var(--h, 1); pointer-events: none; }
  .anim .hint::after { content: "↓"; display: block; margin-top: .3rem; font-size: 1.2rem; letter-spacing: 0; animation: bob 1.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(6px); } }
</style>
</head>
<body>
<div class="scroller" id="scroller">
  <div class="stage">
    <section class="reveal" aria-label="Plats">
      <figure class="photo"><img src="greenlion.jpg" alt="Inne på The Green Lion: baren till vänster, färgade glasrutor i taket och bokhyllor längst in, i dämpad belysning" width="550" height="412"></figure>
      <div class="meet">
        <div class="kicker">Vi ses på</div>
        <h2>The Green Lion</h2>
        <dl class="when">
          <div><dt>Datum</dt><dd>Fredag 4 december</dd></div>
          <div><dt>Tid</dt><dd>Meddelas senare</dd></div>
          <div><dt>Plats</dt><dd>Adress meddelas senare</dd></div>
        </dl>
      </div>
    </section>

    <div class="posterwrap" id="posterwrap">
      <img class="toucan" src="tukan.png" alt="Tecknad tukan med ett glas mörk stout balanserat på näbben" width="500" height="495">
      <main class="poster" id="poster">
        <div class="lovely">En underbar kväll för en</div>
        <h1 class="big">Jul-öl</h1>

        <p class="note">Kom och dela årets första julöl med oss.</p>
        <div class="sign">Hälsningar, TB</div>
      </main>
    </div>

    <div class="hint" aria-hidden="true">Scrolla</div>
  </div>
</div>

<script>
  (function () {
    var root = document.getElementById('scroller');
    var wrap = document.getElementById('posterwrap');
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    root.classList.add('anim');

    var clamp = function (x) { return Math.min(1, Math.max(0, x)); };
    var queued = false;

    function update() {
      queued = false;
      var max = root.offsetHeight - innerHeight;
      var p = max > 0 ? clamp(-root.getBoundingClientRect().top / max) : 0;
      var fit = Math.min(1, (innerHeight - 24) / wrap.offsetHeight);
      var s = root.style;
      s.setProperty('--t', clamp(p / 0.4));
      s.setProperty('--u', clamp((p - 0.12) / 0.4));
      s.setProperty('--v', clamp((p - 0.55) / 0.2));
      s.setProperty('--h', 1 - clamp(p / 0.08));
      s.setProperty('--fit', fit);
    }
    function request() { if (!queued) { queued = true; requestAnimationFrame(update); } }

    addEventListener('scroll', request, { passive: true });
    addEventListener('resize', request);
    addEventListener('load', request);
    update();
  })();
</script>
</body>
</html>
