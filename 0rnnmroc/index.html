<style>
  :root {
    --page: #e9e4d8; --paper: #f7f2e6; --ink: #14161c; --coral: #f4715c; --muted: #6d6a60; --navy: #101c38;
    --didone: "Playfair Display", "Bodoni 72", Didot, Georgia, serif;
    --sans: "Libre Franklin", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.25rem; background: var(--page); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }

  .cover { position: relative; width: 100%; max-width: 480px; background: var(--paper); border-left: 14px solid var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.2), 0 22px 44px rgba(0,0,0,.28); }

  .art { position: relative; background: var(--navy); }
  .art svg { display: block; width: 100%; height: auto; }
  .top { position: absolute; inset: 0 0 auto 0; z-index: 2; padding: .9rem 1.1rem 0; display: flex; justify-content: space-between; font-family: var(--didone); font-style: italic; font-size: .78rem; color: #e9e4d8; }
  .masthead { position: absolute; inset: 1.6rem 0 auto 0; z-index: 2; text-align: center; color: var(--coral); line-height: .9; }
  .masthead .small { display: block; font-family: var(--didone); font-weight: 500; font-size: clamp(1.1rem, 5vw, 1.45rem); letter-spacing: .12em; text-transform: uppercase; }
  .masthead .title { display: block; font-family: var(--didone); font-weight: 400; font-size: clamp(3.4rem, 17vw, 5.4rem); letter-spacing: -.02em; text-transform: uppercase; margin-top: .1em; }
  .sig { position: absolute; right: .9rem; bottom: .7rem; z-index: 2; font-family: var(--didone); font-style: italic; font-size: 1rem; color: #f7d96b; }

  .info { padding: 1.4rem 1.4rem 1.6rem; text-align: center; }
  .line { text-wrap: balance; font-family: var(--didone); font-style: italic; font-size: clamp(1.35rem, 6vw, 1.7rem); line-height: 1.2; margin: 0 0 1.1rem; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: .8rem; border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); padding: .9rem 0; }
  .grid div + div { border-left: 1px solid #c9c3b3; }
  .grid b { display: block; font-size: .6rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-bottom: .25rem; }
  .grid span { font-family: var(--didone); font-size: 1rem; line-height: 1.25; }
  .grid small { display: block; font-family: var(--sans); font-size: .68rem; color: var(--muted); margin-top: .15rem; }
  .sign { margin-top: 1rem; font-size: .66rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }

  @media (max-width: 420px) {
    .grid { grid-template-columns: 1fr; gap: .7rem; }
    .grid div + div { border-left: 0; border-top: 1px solid #c9c3b3; padding-top: .7rem; }
  }
</style>
